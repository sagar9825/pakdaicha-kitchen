<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Audio Player</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    }

    body {
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      background: #121212;
      color: #ffffff;
    }

    .player-card {
      background: #1e1e1e;
      padding: 24px;
      border-radius: 16px;
      width: 100%;
      max-width: 380px;
      box-shadow: 0 8px 24px rgba(0, 0, 0, 0.5);
    }

    .track-info {
      text-align: center;
      margin-bottom: 20px;
    }

    .track-title {
      font-size: 1.25rem;
      font-weight: 600;
      margin-bottom: 6px;
    }

    .track-artist {
      font-size: 0.9rem;
      color: #a0a0a0;
    }

    .progress-container {
      display: flex;
      flex-direction: column;
      gap: 6px;
      margin-bottom: 20px;
    }

    .seek-slider {
      -webkit-appearance: none;
      appearance: none;
      width: 100%;
      height: 6px;
      background: #333333;
      border-radius: 3px;
      outline: none;
      cursor: pointer;
    }

    .seek-slider::-webkit-slider-thumb {
      -webkit-appearance: none;
      appearance: none;
      width: 14px;
      height: 14px;
      border-radius: 50%;
      background: #1db954;
      cursor: pointer;
    }

    .seek-slider::-moz-range-thumb {
      width: 14px;
      height: 14px;
      border-radius: 50%;
      background: #1db954;
      cursor: pointer;
      border: none;
    }

    .time-stamps {
      display: flex;
      justify-content: space-between;
      font-size: 0.8rem;
      color: #888888;
    }

    .controls {
      display: flex;
      justify-content: center;
      align-items: center;
      gap: 20px;
    }

    .btn {
      background: #1db954;
      border: none;
      color: #000000;
      font-weight: 600;
      padding: 12px 24px;
      border-radius: 30px;
      cursor: pointer;
      font-size: 1rem;
      transition: background 0.2s ease;
    }

    .btn:hover {
      background: #1ed760;
    }
  </style>
</head>
<body>

  <div class="player-card">
    <div class="track-info">
      <div class="track-title" id="title">Sample Track</div>
      <div class="track-artist" id="artist">Artist Name</div>
    </div>

    <!-- Audio Element with preload set to metadata -->
    <audio id="audio" preload="metadata" src="https://www.soundhelix.com/examples/mp3/SoundHelix-Song-1.mp3"></audio>

    <div class="progress-container">
      <input type="range" id="seek-bar" class="seek-slider" value="0" min="0" max="100" step="0.1">
      <div class="time-stamps">
        <span id="current-time">0:00</span>
        <span id="duration">0:00</span>
      </div>
    </div>

    <div class="controls">
      <button class="btn" id="play-btn">Play</button>
    </div>
  </div>

  <script>
    const audio = document.getElementById('audio');
    const playBtn = document.getElementById('play-btn');
    const seekBar = document.getElementById('seek-bar');
    const currentTimeEl = document.getElementById('current-time');
    const durationEl = document.getElementById('duration');

    let isSeeking = false;

    function formatTime(seconds) {
      if (isNaN(seconds) || seconds < 0) return '0:00';
      const mins = Math.floor(seconds / 60);
      const secs = Math.floor(seconds % 60);
      return `${mins}:${secs < 10 ? '0' : ''}${secs}`;
    }

    // Ensure audio duration is loaded before enabling seeks
    audio.addEventListener('loadedmetadata', () => {
      seekBar.max = audio.duration;
      durationEl.textContent = formatTime(audio.duration);
    });

    // Update progress bar during playback (only when user isn't actively dragging)
    audio.addEventListener('timeupdate', () => {
      if (!isSeeking && audio.duration) {
        seekBar.value = audio.currentTime;
        currentTimeEl.textContent = formatTime(audio.currentTime);
      }
    });

    // Handle play / pause toggle
    playBtn.addEventListener('click', () => {
      if (audio.paused) {
        audio.play();
        playBtn.textContent = 'Pause';
      } else {
        audio.pause();
        playBtn.textContent = 'Play';
      }
    });

    // Seek handling: Pause tracking while dragging, set currentTime on release
    seekBar.addEventListener('input', () => {
      isSeeking = true;
      currentTimeEl.textContent = formatTime(seekBar.value);
    });

    seekBar.addEventListener('change', () => {
      if (audio.duration) {
        audio.currentTime = Number(seekBar.value);
      }
      isSeeking = false;
    });

    audio.addEventListener('ended', () => {
      playBtn.textContent = 'Play';
      seekBar.value = 0;
      currentTimeEl.textContent = '0:00';
    });
  </script>
</body>
</html>
