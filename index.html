<!DOCTYPE html>
<html lang="ne">

<head>
  <!-- Browser Tab Favicon -->
  <link rel="icon" type="image/svg+xml"
    href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><circle cx='50' cy='50' r='48' fill='%232a1003' stroke='%23f5a623' stroke-width='4'/><circle cx='50' cy='50' r='18' fill='%23f5a623'/><circle cx='50' cy='50' r='6' fill='%23140700'/><text x='50%' y='55%' text-anchor='middle' fill='%23ffffff' font-size='26' font-family='sans-serif' dy='.3em'>📻</text></svg>" />
  <meta charset="UTF-8" />
  <meta name="viewport"
    content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
  <title>&#2346;&#2366;&#2325;&#2381;&#2342;&#2376;&#2331; | Kitchen Radio</title>
  <meta name="description"
    content="Pakdaicha pure audio kitchen radio — nostalgic Indian & Nepali music for cooking vibes." />
  <meta name="theme-color" content="#250e02" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link
    href="https://fonts.googleapis.com/css2?family=Roboto+Mono:wght@400;600&family=Outfit:wght@300;400;500;600;700;800&family=Noto+Sans+Devanagari:wght@400;700;900&display=swap"
    rel="stylesheet" />
  <style>
    *,
    *::before,
    *::after {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      -webkit-tap-highlight-color: transparent;
    }

    :root {
      --sa: #f5a623;
      --sa-glow: rgba(245, 166, 35, 0.45);
      --cr: #fdf0d0;
      --tp: #fdf6ee;
      --tm: rgba(253, 240, 208, 0.75);
      --bg-glass: rgba(28, 11, 2, 0.90);
      --border-glass: rgba(255, 210, 130, 0.38);
      --radius-pill: 9999px;
      --radius-card: 20px;
      --safe-bottom: env(safe-area-inset-bottom, 0px);
      --safe-top: env(safe-area-inset-top, 0px);
    }

    html,
    body {
      height: 100%;
      width: 100%;
      overflow: hidden;
      background: #140700;
      font-family: 'Outfit', sans-serif;
      color: var(--tp);
      user-select: none;
    }

    #bg {
      position: fixed;
      inset: 0;
      background: url('kitchen_bg.jpg') center top/cover no-repeat;
      z-index: 0;
      transform: translateZ(0);
    }

    /* Mobile background image switch */
    @media (max-width: 680px) {
      #bg {
        background-image: url('pakdaicha%20mob.jpg');
      }
    }

    #bg::after {
      content: "";
      position: absolute;
      inset: 0;
      background: linear-gradient(to bottom,
          rgba(20, 8, 0, 0.35) 0%,
          rgba(20, 8, 0, 0.12) 25%,
          rgba(16, 6, 0, 0.55) 65%,
          rgba(12, 4, 0, 0.94) 100%);
    }

    /* Ambient cooking steam particles */
    .steam {
      position: fixed;
      bottom: 120px;
      width: 6px;
      border-radius: 50%;
      background: rgba(255, 240, 200, 0.14);
      filter: blur(4px);
      animation: sr var(--d, 6s) ease-in infinite var(--dl, 0s);
      z-index: 2;
      pointer-events: none;
    }

    @keyframes sr {
      0% {
        transform: translateY(0) scaleX(1);
        opacity: 0;
        height: 8px;
      }

      20% {
        opacity: 0.6;
      }

      60% {
        transform: translateY(-140px) translateX(var(--dx, 12px)) scaleX(1.6);
        opacity: 0.25;
        height: 18px;
      }

      100% {
        transform: translateY(-260px) translateX(calc(var(--dx, 12px) * 2)) scaleX(2.2);
        opacity: 0;
        height: 24px;
      }
    }

    /* App container */
    #app {
      position: fixed;
      inset: 0;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      z-index: 10;
      padding-top: var(--safe-top);
      padding-bottom: var(--safe-bottom);
      overflow: hidden;
    }

    /* Header Desktop */
    header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 14px 20px;
      position: relative;
      flex-shrink: 0;
      z-index: 20;
    }

    .header-left {
      display: flex;
      align-items: center;
      z-index: 2;
    }

    #clk {
      font-family: 'Roboto Mono', monospace;
      font-size: 0.92rem;
      font-weight: 600;
      color: var(--tp);
      text-shadow: 0 1px 8px rgba(0, 0, 0, 0.8), 0 0 16px var(--sa-glow);
      letter-spacing: 0.04em;
    }

    .header-center {
      position: absolute;
      left: 50%;
      top: 50%;
      transform: translate(-50%, -50%);
      display: flex;
      align-items: center;
      justify-content: center;
      z-index: 3;
    }

    #lbadge {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      background: rgba(42, 16, 3, 0.78);
      backdrop-filter: blur(20px);
      -webkit-backdrop-filter: blur(20px);
      border: 1px solid var(--border-glass);
      border-radius: var(--radius-pill);
      padding: 5px 14px;
      font-size: 0.8rem;
      font-weight: 700;
      color: var(--tp);
      box-shadow: 0 4px 18px rgba(0, 0, 0, 0.45), 0 0 16px rgba(245, 166, 35, 0.2);
      white-space: nowrap;
    }

    .dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: var(--sa);
      animation: ps 1.8s infinite;
      flex-shrink: 0;
    }

    @keyframes ps {
      0% {
        box-shadow: 0 0 0 0 rgba(245, 166, 35, 0.85);
      }

      70% {
        box-shadow: 0 0 0 8px rgba(245, 166, 35, 0);
      }

      100% {
        box-shadow: 0 0 0 0 rgba(245, 166, 35, 0);
      }
    }

    .header-right {
      display: flex;
      align-items: center;
      gap: 6px;
      z-index: 2;
    }

    .pill {
      display: inline-flex;
      align-items: center;
      gap: 5px;
      padding: 6px 12px;
      border-radius: var(--radius-pill);
      background: rgba(45, 18, 3, 0.72);
      backdrop-filter: blur(18px);
      -webkit-backdrop-filter: blur(18px);
      border: 1px solid var(--border-glass);
      color: var(--tp);
      font-family: 'Outfit', sans-serif;
      font-size: 0.78rem;
      font-weight: 600;
      cursor: pointer;
      text-decoration: none;
      white-space: nowrap;
      transition: background 0.2s, transform 0.15s;
    }

    .pill:active {
      transform: scale(0.96);
      background: rgba(90, 40, 8, 0.85);
    }

    /* Floating External Links */
    .stream-dock {
      position: absolute;
      top: 68px;
      right: 20px;
      display: flex;
      flex-direction: column;
      gap: 8px;
      z-index: 30;
    }

    .stream-btn {
      display: flex;
      align-items: center;
      justify-content: center;
      width: 38px;
      height: 38px;
      border-radius: 50%;
      background: rgba(35, 14, 2, 0.82);
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      border: 1px solid var(--border-glass);
      box-shadow: 0 6px 18px rgba(0, 0, 0, 0.45);
      transition: transform 0.2s cubic-bezier(0.34, 1.56, 0.64, 1), background 0.2s, border-color 0.2s;
      text-decoration: none;
    }

    .stream-btn svg {
      width: 18px;
      height: 18px;
    }

    .stream-btn:hover {
      transform: scale(1.1);
      border-color: rgba(255, 210, 130, 0.7);
    }

    .stream-btn.ytmusic:hover {
      background: rgba(255, 0, 0, 0.22);
      border-color: #ff3333;
    }

    main {
      flex: 1;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: flex-end;
      padding: 0 16px;
      pointer-events: none;
    }

    /* Compact Player wrap */
    #pw {
      width: 100%;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 0 12px 10px;
      z-index: 20;
    }

    #player {
      background: var(--bg-glass);
      backdrop-filter: blur(30px) saturate(190%);
      -webkit-backdrop-filter: blur(30px) saturate(190%);
      border: 1.5px solid var(--border-glass);
      border-radius: 22px;
      box-shadow: 0 10px 36px rgba(0, 0, 0, 0.8), 0 1px 0 rgba(255, 200, 100, 0.2) inset;
      width: 100%;
      max-width: 680px;
      padding: 8px 14px;
      display: flex;
      align-items: center;
      gap: 12px;
      position: relative;
    }

    /* Mini vinyl record */
    #vw {
      flex-shrink: 0;
      position: relative;
      width: 44px;
      height: 44px;
      border-radius: 50%;
    }

    #vart {
      width: 44px;
      height: 44px;
      border-radius: 50%;
      border: 1.5px solid rgba(255, 200, 100, 0.45);
      box-shadow: 0 0 0 1px rgba(0, 0, 0, 0.5), 0 3px 10px rgba(0, 0, 0, 0.6);
      display: block;
      animation: spin 3.5s linear infinite;
      animation-play-state: paused;
    }

    #vart.sp {
      animation-play-state: running;
    }

    @keyframes spin {
      from {
        transform: rotate(0deg);
      }

      to {
        transform: rotate(360deg);
      }
    }

    .vctr {
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      width: 10px;
      height: 10px;
      border-radius: 50%;
      background: radial-gradient(circle, #fdf0d0 30%, #888 100%);
      border: 1.5px solid rgba(255, 255, 255, 0.7);
      pointer-events: none;
    }

    /* Track metadata & seek */
    #tmeta {
      flex: 1;
      display: flex;
      flex-direction: column;
      gap: 2px;
      min-width: 0;
    }

    #tttl {
      font-size: 0.86rem;
      font-weight: 700;
      color: var(--tp);
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    #tart {
      font-size: 0.70rem;
      color: var(--tm);
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .srow {
      display: flex;
      align-items: center;
      gap: 8px;
      margin-top: 2px;
    }

    #seek {
      flex: 1;
      -webkit-appearance: none;
      appearance: none;
      height: 6px;
      border-radius: 4px;
      background: rgba(255, 200, 100, 0.2);
      outline: none;
      cursor: pointer;
      touch-action: none;
    }

    #seek::-webkit-slider-thumb {
      -webkit-appearance: none;
      width: 14px;
      height: 14px;
      border-radius: 50%;
      background: var(--sa);
      box-shadow: 0 0 6px var(--sa);
      cursor: pointer;
    }

    #seek::-moz-range-thumb {
      width: 14px;
      height: 14px;
      border-radius: 50%;
      background: var(--sa);
      border: none;
      cursor: pointer;
    }

    #tdisp {
      font-family: 'Roboto Mono', monospace;
      font-size: 0.65rem;
      color: var(--tm);
      white-space: nowrap;
      flex-shrink: 0;
    }

    /* Controls */
    #ctrl {
      display: flex;
      align-items: center;
      gap: 10px;
      flex-shrink: 0;
    }

    .cbut {
      background: none;
      border: none;
      outline: none;
      cursor: pointer;
      width: 26px;
      height: 26px;
      display: flex;
      align-items: center;
      justify-content: center;
      color: rgba(255, 255, 255, 0.75);
      transition: color 0.15s, transform 0.12s;
    }

    .cbut:hover {
      color: #ffffff;
    }

    .cbut:active {
      transform: scale(0.90);
    }

    .cbut svg {
      width: 100%;
      height: 100%;
      fill: currentColor;
    }

    #pbut {
      width: 44px;
      height: 44px;
      background: #ffffff;
      color: #1a2228;
      border: none;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      flex-shrink: 0;
      box-shadow: 0 3px 14px rgba(0, 0, 0, 0.45);
      transition: transform 0.12s, background 0.15s;
    }

    #pbut:hover {
      background: #f0f0f0;
      transform: scale(1.04);
    }

    #pbut:active {
      transform: scale(0.93);
    }

    #pbut svg {
      width: 17px;
      height: 17px;
      fill: currentColor;
    }

    .icon-play {
      margin-left: 2px;
    }

    /* Volume */
    #vgrp {
      display: flex;
      align-items: center;
      gap: 5px;
      flex-shrink: 0;
    }

    #vico {
      font-size: 0.95rem;
      cursor: pointer;
      color: var(--tm);
      user-select: none;
      padding: 2px;
    }

    #vslid {
      -webkit-appearance: none;
      appearance: none;
      width: 52px;
      height: 4px;
      border-radius: 4px;
      background: rgba(255, 200, 100, 0.2);
      outline: none;
      cursor: pointer;
    }

    #vslid::-webkit-slider-thumb {
      -webkit-appearance: none;
      width: 10px;
      height: 10px;
      border-radius: 50%;
      background: var(--cr);
      cursor: pointer;
    }

    #hiss {
      display: inline-flex;
      align-items: center;
      gap: 3px;
      padding: 5px 9px;
      border-radius: var(--radius-pill);
      background: rgba(255, 200, 80, 0.08);
      border: 1px solid rgba(255, 200, 80, 0.25);
      color: var(--tm);
      font-size: 0.68rem;
      font-weight: 600;
      cursor: pointer;
      white-space: nowrap;
      font-family: 'Outfit', sans-serif;
    }

    #hiss.on {
      background: rgba(245, 166, 35, 0.25);
      border-color: rgba(245, 166, 35, 0.65);
      color: var(--sa);
    }

    #contact {
      font-size: 0.64rem;
      color: rgba(253, 240, 208, 0.4);
      text-align: center;
      margin-top: 4px;
    }

    /* Drawers */
    .mover {
      position: fixed;
      inset: 0;
      z-index: 80;
      background: rgba(10, 4, 0, 0.75);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      display: flex;
      align-items: flex-end;
      justify-content: center;
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.28s cubic-bezier(0.2, 0.9, 0.3, 1);
    }

    .mover.open {
      opacity: 1;
      pointer-events: all;
    }

    .mdraw {
      background: rgba(30, 11, 2, 0.94);
      backdrop-filter: blur(36px) saturate(190%);
      -webkit-backdrop-filter: blur(36px) saturate(190%);
      border: 1px solid var(--border-glass);
      border-bottom: none;
      border-radius: 24px 24px 0 0;
      width: 100%;
      max-width: 640px;
      max-height: 85vh;
      display: flex;
      flex-direction: column;
      transform: translateY(100%);
      transition: transform 0.34s cubic-bezier(0.2, 0.9, 0.3, 1);
      box-shadow: 0 -12px 64px rgba(0, 0, 0, 0.85);
      padding-bottom: var(--safe-bottom);
    }

    .mover.open .mdraw {
      transform: translateY(0);
    }

    .mhand {
      width: 40px;
      height: 4px;
      background: rgba(255, 200, 100, 0.3);
      border-radius: 2px;
      margin: 10px auto 4px;
      flex-shrink: 0;
    }

    .mhead {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 8px 16px 10px;
      border-bottom: 1px solid rgba(255, 200, 100, 0.12);
      flex-shrink: 0;
    }

    .mtit {
      font-size: 0.95rem;
      font-weight: 700;
      color: var(--tp);
    }

    .mclose {
      width: 28px;
      height: 28px;
      border-radius: 50%;
      background: rgba(255, 200, 80, 0.1);
      border: 1px solid rgba(255, 200, 80, 0.25);
      color: var(--tm);
      font-size: 1rem;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .mbody {
      flex: 1;
      overflow-y: auto;
      -webkit-overflow-scrolling: touch;
      padding: 10px 14px 20px;
    }

    .sitem {
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 8px 10px;
      border-radius: 12px;
      cursor: pointer;
      transition: background 0.15s;
      border: 1px solid transparent;
      margin-bottom: 4px;
    }

    .sitem.cur {
      background: rgba(245, 166, 35, 0.18);
      border-color: rgba(245, 166, 35, 0.45);
    }

    .snum {
      font-family: 'Roboto Mono', monospace;
      font-size: 0.72rem;
      color: var(--tm);
      width: 20px;
      text-align: right;
      flex-shrink: 0;
    }

    .sthumb {
      width: 36px;
      height: 36px;
      border-radius: 8px;
      background: linear-gradient(135deg, #7c3a00, #321200);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 1.1rem;
      flex-shrink: 0;
      border: 1px solid rgba(255, 200, 80, 0.25);
    }

    .sinf {
      flex: 1;
      min-width: 0;
    }

    .stit {
      font-size: 0.82rem;
      font-weight: 600;
      color: var(--tp);
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .sart {
      font-size: 0.70rem;
      color: var(--tm);
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .sdur {
      font-family: 'Roboto Mono', monospace;
      font-size: 0.68rem;
      color: var(--tm);
      flex-shrink: 0;
    }

    .pcard {
      display: flex;
      align-items: center;
      gap: 12px;
      padding: 12px;
      border-radius: 14px;
      background: rgba(255, 200, 80, 0.06);
      border: 1px solid rgba(255, 200, 80, 0.18);
      cursor: pointer;
      margin-bottom: 10px;
    }

    .pcov {
      width: 46px;
      height: 46px;
      border-radius: 10px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 1.4rem;
      flex-shrink: 0;
      border: 1px solid rgba(255, 200, 80, 0.25);
    }

    .pinf h4 {
      font-size: 0.88rem;
      font-weight: 700;
      color: var(--tp);
      margin-bottom: 2px;
    }

    .pinf p {
      font-size: 0.72rem;
      color: var(--tm);
    }

    .pcount {
      display: inline-block;
      margin-top: 4px;
      font-size: 0.65rem;
      font-weight: 700;
      color: var(--sa);
      background: rgba(245, 166, 35, 0.15);
      border: 1px solid rgba(245, 166, 35, 0.35);
      padding: 2px 6px;
      border-radius: var(--radius-pill);
    }

    /* Mobile view: Fix overlap */
    @media (max-width: 680px) {
      header {
        padding: 8px 10px;
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 4px;
      }

      .header-left,
      .header-center,
      .header-right {
        position: static;
        transform: none;
      }

      #clk {
        font-size: 0.74rem;
      }

      #lbadge {
        font-size: 0.68rem;
        padding: 3px 8px;
        gap: 4px;
      }

      .dot {
        width: 6px;
        height: 6px;
      }

      .header-right {
        gap: 4px;
      }

      .header-right .pill {
        padding: 4px 7px;
        font-size: 0.68rem;
        gap: 3px;
      }

      .stream-dock {
        top: 52px;
        right: 10px;
        gap: 6px;
      }

      .stream-btn {
        width: 32px;
        height: 32px;
      }

      .stream-btn svg {
        width: 15px;
        height: 15px;
      }

      #player {
        padding: 6px 10px;
        border-radius: 16px;
        gap: 8px;
      }

      #vw,
      #vart {
        width: 36px;
        height: 36px;
      }

      #ctrl {
        gap: 6px;
      }

      #pbut {
        width: 36px;
        height: 36px;
      }

      #pbut svg {
        width: 14px;
        height: 14px;
      }

      .cbut {
        width: 22px;
        height: 22px;
      }

      #vgrp,
      #hiss {
        display: none;
      }
    }
  </style>
</head>

<body>

  <div id="bg"></div>
  <div class="steam" style="left:34%;--d:5.5s;--dl:0s;--dx:12px"></div>
  <div class="steam" style="left:42%;--d:6.5s;--dl:1.2s;--dx:-10px"></div>
  <div class="steam" style="left:50%;--d:5s;--dl:.6s;--dx:8px"></div>
  <div class="steam" style="left:58%;--d:7s;--dl:2s;--dx:-12px"></div>

  <!-- Songs Queue Drawer -->
  <div class="mover" id="mo-songs" role="dialog" aria-modal="true">
    <div class="mdraw">
      <div class="mhand"></div>
      <div class="mhead">
        <div style="display:flex;align-items:center;gap:8px;flex:1;min-width:0">
          <button id="songs-back" onclick="goBackToPlaylists()" aria-label="Back to playlists"
            style="display:none;background:rgba(255,200,80,.12);border:1px solid rgba(255,200,80,.25);color:var(--tm);width:28px;height:28px;border-radius:50%;cursor:pointer;font-size:.8rem;flex-shrink:0;align-items:center;justify-content:center">&#8592;</button>
          <div>
            <span class="mtit" id="songs-heading">🎵 All Songs</span>
            <div id="songs-sub" style="font-size:.65rem;color:var(--tm);margin-top:1px"></div>
          </div>
        </div>
        <button class="mclose" onclick="cm('songs')" aria-label="Close">&#x2715;</button>
      </div>
      <div class="mbody" id="songlist"></div>
    </div>
  </div>

      { "t": "Zara Sa", "a": "Jannat | KK", "d": "5:08", "ds": 308, "src": "/audio/-8C_2BBVWk8.mp3", "cat": "hindi", "e": "🎸" },
      { "t": "Zindagi Do Pal Ki", "a": "Kites | KK", "d": "4:01", "ds": 241, "src": "/audio/r-XG86T2jNc.mp3", "cat": "hindi", "e": "🌻" },
      { "t": "Main Rahoon Ya Na Rahoon", "a": "Armaan Malik", "d": "6:46", "ds": 406, "src": "/audio/Dp6lbdoprZ0.mp3", "cat": "hindi", "e": "💫" },
      { "t": "Kaise Mujhe Tum Mil Gayi", "a": "Ghajini | Benny Dayal, Shreya", "d": "7:02", "ds": 422, "src": "/audio/MdhjLM-99lQ.mp3", "cat": "hindi", "e": "🎵" },
      { "t": "Afreen Afreen", "a": "Coke Studio | Rahat Fateh Ali & Momina", "d": "6:45", "ds": 405, "src": "/audio/kw4tT7SCmaY.mp3", "cat": "hindi", "e": "🥀" }
    ];

    // State Variables[cite: 14]
    let ci = 0;
    let ip = false;
    let mu = false;
    let ho = false;
    let activeCat = null;
    let isSeeking = false;
    let ac = null, hn = null, hg = null;

    const audio = new Audio();
    audio.preload = "auto";
    audio.volume = 0.85;

    function $(id) { return document.getElementById(id); }

    function fmt(s) {
      if (!isFinite(s) || isNaN(s) || s < 0) return "0:00";
      s = Math.floor(s);
      return Math.floor(s / 60) + ":" + Math.floor(s % 60).toString().padStart(2, "0");
    }

    function initAC() {
      try {
        if (!ac) ac = new (window.AudioContext || window.webkitAudioContext)();
      } catch (e) {
        console.warn("AudioContext init error:", e);
      }
    }

    function buildHiss() {
      try {
        if (!ac) return;
        if (hn) { try { hn.stop(); } catch (e) { } hn.disconnect(); hn = null; }
        const buf = ac.createBuffer(1, ac.sampleRate * 4, ac.sampleRate);
        const d = buf.getChannelData(0);
        for (let i = 0; i < d.length; i++) {
          d[i] = (Math.random() * 2 - 1) * 0.025;
          if (Math.random() < 0.0006) d[i] += (Math.random() - 0.5) * 0.6;
        }
        hn = ac.createBufferSource();
        hn.buffer = buf;
        hn.loop = true;
        const f = ac.createBiquadFilter();
        f.type = "bandpass";
        f.frequency.value = 2600;
        f.Q.value = 0.55;
        hg = ac.createGain();
        hg.gain.value = 0;
        hn.connect(f);
        f.connect(hg);
        hg.connect(ac.destination);
        hn.start();
      } catch (e) {
        console.warn("Hiss build error:", e);
      }
    }

    function toggleHiss() {
      initAC();
      if (ac && ac.state === "suspended") ac.resume();
      if (!hn) buildHiss();
      ho = !ho;
      if (hg && ac) hg.gain.setTargetAtTime(ho ? 0.55 : 0, ac.currentTime, 0.12);
      $("hiss").classList.toggle("on", ho);
    }

    function makeArt(e) {
      const cv = document.createElement("canvas");
      cv.width = cv.height = 128;
      const x = cv.getContext("2d");
      const g = x.createRadialGradient(64, 64, 6, 64, 64, 64);
      g.addColorStop(0, "#1a0900");
      g.addColorStop(0.28, "#2e1200");
      g.addColorStop(0.65, "#1a0900");
      g.addColorStop(1, "#040100");
      x.fillStyle = g;
      x.beginPath();
      x.arc(64, 64, 64, 0, Math.PI * 2);
      x.fill();

      for (let r = 18; r < 62; r += 3.2) {
        x.beginPath();
        x.arc(64, 64, r, 0, Math.PI * 2);
        x.strokeStyle = "rgba(255,180,60," + (0.03 + Math.random() * 0.02) + ")";
        x.lineWidth = 0.5;
        x.stroke();
      }

      const lg = x.createRadialGradient(62, 60, 2, 64, 64, 22);
      lg.addColorStop(0, "#f5a623");
      lg.addColorStop(0.5, "#c46b00");
      lg.addColorStop(1, "#7a3a00");
      x.beginPath();
      x.arc(64, 64, 22, 0, Math.PI * 2);
      x.fillStyle = lg;
      x.fill();

      x.font = "18px serif";
      x.textAlign = "center";
      x.textBaseline = "middle";
      x.fillText(e, 64, 65);

      x.beginPath();
      x.arc(64, 64, 4, 0, Math.PI * 2);
      x.fillStyle = "#888";
      x.fill();
      return cv.toDataURL();
    }

    // Live Audio Updates
    audio.addEventListener("timeupdate", () => {
      if (isSeeking) return;
      const cur = audio.currentTime;
      const dur = audio.duration || (TRK[ci] ? TRK[ci].ds : 0);
      if (dur > 0) {
        const p = (cur / dur) * 100;
        $("seek").value = p;
        sf(p);
        $("tdisp").textContent = fmt(cur) + " / " + (isFinite(audio.duration) ? fmt(audio.duration) : TRK[ci].d);
      }
    });

    audio.addEventListener("loadedmetadata", () => {
      if (isFinite(audio.duration)) {
        $("tdisp").textContent = fmt(audio.currentTime) + " / " + fmt(audio.duration);
      }
    });

    audio.addEventListener("play", () => setP(true));
    audio.addEventListener("pause", () => setP(false));
    audio.addEventListener("ended", () => next());

    function loadTrack(idx, autoplay = false) {
      if (idx < 0 || idx >= TRK.length) return;
      const t = TRK[idx];
      ci = idx;

      $("tttl").textContent = t.t;
      $("tart").textContent = t.a;
      $("tdisp").textContent = "0:00 / " + t.d;
      $("seek").value = 0;
      sf(0);

      const img = $("vart");
      if (img) { img.src = makeArt(t.e); img.alt = t.t; }

      audio.src = t.src;
      audio.load();

      if (autoplay) {
        play();
      } else {
        setP(false);
      }
      renderSongs(activeCat);
    }

    function play() {
      initAC();
      if (ac && ac.state === "suspended") ac.resume();

      const playPromise = audio.play();
      if (playPromise !== undefined) {
        playPromise.then(() => {
          setP(true);
        }).catch(err => {
          console.warn("Autoplay policy waiting for interaction:", err);
          const unlock = () => {
            audio.play();
            setP(true);
            document.removeEventListener("click", unlock);
            document.removeEventListener("touchstart", unlock);
          };
          document.addEventListener("click", unlock, { once: true });
          document.addEventListener("touchstart", unlock, { once: true });
        });
      }
    }

    function pause() {
      audio.pause();
      setP(false);
    }

    function setP(p) {
      ip = p;
      const playIcon = $("playIcon");
      const pauseIcon = $("pauseIcon");

      if (p) {
        playIcon.style.display = "none";
        pauseIcon.style.display = "block";
        $("vart").classList.add("sp");
      } else {
        playIcon.style.display = "block";
        pauseIcon.style.display = "none";
        $("vart").classList.remove("sp");
      }
      $("pbut").setAttribute("aria-label", p ? "Pause" : "Play");
    }

    function togglePlayPause() {
      if (ip) {
        pause();
      } else {
        if (!audio.src || audio.src === "" || audio.src.endsWith("/")) {
          loadTrack(ci, true);
        } else {
          play();
        }
      }
    }
    window.togglePlayPause = togglePlayPause;

    function next() {
      let nextIdx = (ci + 1) % TRK.length;
      if (activeCat) {
        const catIndices = TRK.map((t, i) => (t.cat === activeCat ? i : -1)).filter(i => i !== -1);
        const currPos = catIndices.indexOf(ci);
        if (currPos !== -1) {
          nextIdx = catIndices[(currPos + 1) % catIndices.length];
        }
      }
      loadTrack(nextIdx, true);
    }

    function prev() {
      let prevIdx = (ci - 1 + TRK.length) % TRK.length;
      if (activeCat) {
        const catIndices = TRK.map((t, i) => (t.cat === activeCat ? i : -1)).filter(i => i !== -1);
        const currPos = catIndices.indexOf(ci);
        if (currPos !== -1) {
          prevIdx = catIndices[(currPos - 1 + catIndices.length) % catIndices.length];
        }
      }
      loadTrack(prevIdx, true);
    }

    $("prevb").addEventListener("click", prev);
    $("nextb").addEventListener("click", next);

    // Precise & Smooth Scrubbing Seeker Handlers
    const seekEl = $("seek");

    function executeSeek(percentVal) {
      const p = parseFloat(percentVal);
      sf(p);
      const targetDuration = (audio.duration && isFinite(audio.duration)) ? audio.duration : (TRK[ci] ? TRK[ci].ds : 0);
      if (targetDuration > 0) {
        const targetTime = (p / 100) * targetDuration;
        try {
          if ('fastSeek' in audio) {
            audio.fastSeek(targetTime);
          } else {
            audio.currentTime = targetTime;
          }
        } catch (err) {
          audio.currentTime = targetTime;
        }
        $("tdisp").textContent = fmt(targetTime) + " / " + fmt(targetDuration);
      }
    }

    seekEl.addEventListener("pointerdown", () => { isSeeking = true; });
    seekEl.addEventListener("pointerup", (e) => {
      executeSeek(e.target.value);
      setTimeout(() => { isSeeking = false; }, 100);
    });

    seekEl.addEventListener("input", e => {
      isSeeking = true;
      const p = parseFloat(e.target.value);
      sf(p);
      const targetDuration = (audio.duration && isFinite(audio.duration)) ? audio.duration : (TRK[ci] ? TRK[ci].ds : 0);
      if (targetDuration > 0) {
        $("tdisp").textContent = fmt((p / 100) * targetDuration) + " / " + fmt(targetDuration);
      }
    });

    seekEl.addEventListener("change", e => {
      executeSeek(e.target.value);
      isSeeking = false;
    });

    // Volume slider
    $("vslid").addEventListener("input", e => {
      const v = parseFloat(e.target.value);
      vf(v);
      audio.volume = v;
      $("vico").textContent = v === 0 ? "🔇" : (v < 0.4 ? "🔉" : "🔊");
    });

    // Mute toggle
    $("vico").addEventListener("click", () => {
      mu = !mu;
      const s = $("vslid");
      audio.muted = mu;
      if (mu) {
        s.value = 0; vf(0); $("vico").textContent = "🔇";
      } else {
        s.value = audio.volume || 0.85; vf(audio.volume || 0.85); $("vico").textContent = "🔊";
      }
    });

    $("hiss").addEventListener("click", toggleHiss);

    function sf(p) { $("seek").style.background = "linear-gradient(to right,#f5a623 " + p + "%,rgba(255,200,100,.2) " + p + "%)"; }
    function vf(v) { $("vslid").style.background = "linear-gradient(to right,#fdf0d0 " + (v * 100) + "%,rgba(255,200,100,.2) " + (v * 100) + "%)"; }

    function clk() {
      const n = new Date();
      let h = n.getHours(), m = n.getMinutes().toString().padStart(2, "0");
      const ap = h >= 12 ? "PM" : "AM";
      h = h % 12 || 12;
      $("clk").textContent = h + ":" + m + " " + ap;
    }
    clk(); setInterval(clk, 1000);

    // Live cooking count bounded between 10 and 40
    let lb = 24;
    setInterval(() => {
      lb = Math.max(10, Math.min(40, lb + Math.floor(Math.random() * 5) - 2));
      $("lcnt").textContent = lb;
    }, 3800);

    function om(n) {
      if (n === "songs") {
        if (!activeCat) {
          $("songs-back").style.display = "none";
          $("songs-heading").textContent = "🎵 All Songs";
          $("songs-sub").textContent = "";
          renderSongs();
        }
      }
      if (n === "playlists") renderPlaylists();
      $("mo-" + n).classList.add("open");
    }

    function cm(n) {
      if (n === "songs") activeCat = null;
      $("mo-" + n).classList.remove("open");
    }

    document.querySelectorAll(".mover").forEach(o => {
      o.addEventListener("click", e => {
        if (e.target === o) {
          const id = o.id.replace("mo-", "");
          cm(id);
        }
      });
    });
    document.addEventListener("keydown", e => {
      if (e.key === "Escape") {
        document.querySelectorAll(".mover.open").forEach(o => {
          const id = o.id.replace("mo-", "");
          cm(id);
        });
      }
    });

    const CATS = {
      nepali: {
        label: "Nepali Songs",
        sub: "Mountain folk & modern Nepali vibes",
        emoji: "🏔️",
        color: "linear-gradient(135deg,#1a4a2e,#0a2016)",
        tag: "nepali"
      },
      hindi: {
        label: "Hindi Songs",
        sub: "Old Bollywood classics & golden hits",
        emoji: "🌹",
        color: "linear-gradient(135deg,#8b2008,#3a0a0a)",
        tag: "hindi"
      }
    };

    function renderSongs(filter) {
      const list = filter
        ? TRK.map((t, i) => ({ ...t, _i: i })).filter(t => t.cat === filter)
        : TRK.map((t, i) => ({ ...t, _i: i }));

      if (!list.length) {
        $("songlist").innerHTML = "<p style='color:var(--tm);font-size:.85rem;padding:24px 0;text-align:center'>No songs found in this category.</p>";
        return;
      }

      $("songlist").innerHTML = list.map((t, n) => {
        const isCur = t._i === ci ? " cur" : "";
        return "<div class='sitem" + isCur + "' onclick='sel(" + t._i + ")' role='button' tabindex='0'>" +
          "<span class='snum'>" + (n + 1) + "</span>" +
          "<div class='sthumb'>" + t.e + "</div>" +
          "<div class='sinf'><div class='stit'>" + t.t + "</div><div class='sart'>" + t.a + "</div></div>" +
          "<span class='sdur'>" + t.d + "</span></div>";
      }).join("");
    }

    function sel(idx) {
      loadTrack(idx, true);
      cm("songs");
      cm("playlists");
    }

    function openPlaylistCat(tag) {
      activeCat = tag;
      const cat = CATS[tag];
      $("songs-back").style.display = "flex";
      $("songs-heading").innerHTML = cat.emoji + " " + cat.label;
      $("songs-sub").textContent = cat.sub;
      cm("playlists");
      om("songs");
      renderSongs(tag);
    }

    function goBackToPlaylists() {
      activeCat = null;
      cm("songs");
      om("playlists");
      renderPlaylists();
    }

    function renderPlaylists() {
      $("pl-heading").textContent = "📻 Kitchen Playlists";
      $("pl-cards").innerHTML = Object.entries(CATS).map(([tag, cat]) => {
        const count = TRK.filter(t => t.cat === tag).length;
        return "<div class='pcard' role='button' tabindex='0' onclick='openPlaylistCat(\"" + tag + "\")'>" +
          "<div class='pcov' style='background:" + cat.color + "'>" + cat.emoji + "</div>" +
          "<div class='pinf'><h4>" + cat.label + "</h4>" +
          "<p>" + cat.sub + "</p>" +
          "<span class='pcount'>" + count + " song" + (count !== 1 ? "s" : "") + "</span>" +
          "</div></div>";
      }).join("");
    }

    // Initialize with a random song on every page load[cite: 14]
    (function init() {
      try {
        const randomIndex = Math.floor(Math.random() * TRK.length);
        loadTrack(randomIndex, true);
        renderPlaylists();
      } catch (err) {
        console.warn("Init warning:", err);
      }
    })();
  </script>
</body>

</html>
